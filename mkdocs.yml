site_name: SySHIP Documentation
site_url: https://syship.readthedocs.io
repo_url: https://github.com/Domiki/SySHIP
repo_name: Domiki/SySHIP

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  palette:
    - scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ko
          name: 한국어
          build: true
      nav_translations:
        ko:
          Home: 홈
          Installation: 설치
          DIMENSION: DIMENSION
          HULL: HULL
          Import: 임포트
          Fairing: 페어링
          Variation: 배리에이션
          Export: 내보내기
          COMPART: COMPART
          FAQ: 자주 묻는 질문

nav:
  - Home: index.md
  - Installation: installation.md
  - DIMENSION: dimension/index.md
  - HULL:
      - Import: hull/import.md
      - Fairing: hull/fairing.md
      - Variation: hull/variation.md
      - Export: hull/export.md
  - COMPART: compart/index.md
  - FAQ: faq.md
