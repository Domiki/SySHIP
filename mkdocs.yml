site_name: SySHIP
site_url: https://syship.readthedocs.io/en/latest/
repo_url: https://github.com/Domiki/SySHIP
repo_name: Domiki/SySHIP

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  palette:
    - scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
