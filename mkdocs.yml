site_name: SySHIP Documentation
site_url: https://syship.readthedocs.io/en/latest/
repo_url: https://github.com/Domiki/SySHIP
repo_name: Domiki/SySHIP
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.png
  palette:
    - scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ko
          name: 한국어
          build: true
          nav_translations:
            Home: 홈
            Installation: 설치
            DIMENSION: DIMENSION
            Overview: 개요
            Requirements: 요구사항
            Principal Dimensions: 주요 제원
            Freeboard: 건현
            Resistance & Propeller: 저항 및 추진기
            Engine Selection: 엔진 선정
            Optimize: 최적화
            HULL: HULL
            Import: 임포트
            Fairing: 페어링
            Variation: 배리에이션
            Export: 내보내기
            COMPART: COMPART
            Modeling: 모델링
            Hydro: 정수력학
            Volume: 용적
            Loading: 적하
            Damage: 손상
            Stability: 복원성
            FAQ: 자주 묻는 질문

nav:
  - Home: index.md
  - Installation: installation.md
  - DIMENSION:
      - Overview: dimension/index.md
      - Requirements: dimension/requirements.md
      - Principal Dimensions: dimension/principal-dimensions.md
      - Freeboard: dimension/freeboard.md
      - Resistance & Propeller: dimension/resistance-propeller.md
      - Engine Selection: dimension/engine-selection.md
      - Optimize: dimension/optimize.md
  - HULL:
      - Import: hull/import.md
      - Fairing: hull/fairing.md
      - Variation: hull/variation.md
      - Export: hull/export.md
  - COMPART:
      - Overview: compart/index.md
      - Import: compart/import.md
      - Modeling: compart/modeling.md
      - Hydro: compart/hydro.md
      - Volume: compart/volume.md
      - Loading: compart/loading.md
      - Damage: compart/damage.md
      - Stability: compart/stability.md
      - Export: compart/export.md
  - FAQ: faq.md
