site_name: SySHIP Documentation
site_url: https://syship.readthedocs.io
repo_url: https://github.com/Domiki/SySHIP
repo_name: Domiki/SySHIP

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ko
          name: 한국어
          build: true
      nav_translations:
        ko:
          Home: 홈
          Getting Started: 시작하기
          Installation: 설치
          Importing a Hull: 선체 임포트
          Hull: 선체
          Fairing: 페어링
          Variation: 배리에이션
          Export: 내보내기
          Compartment: 구획
          FAQ: 자주 묻는 질문

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Importing a Hull: getting-started/importing-a-hull.md
  - Hull:
      - Fairing: hull/fairing.md
      - Variation: hull/variation.md
      - Export: hull/export.md
  - Compartment: compart/index.md
  - FAQ: faq.md
